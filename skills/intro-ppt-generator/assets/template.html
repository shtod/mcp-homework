<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自我介绍 — {{NAME}}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    background: #1a1a2e;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; overflow: hidden;
  }
  .container {
    width: 90vw; max-width: 1000px; height: 70vh; max-height: 650px;
    position: relative; perspective: 1200px;
  }
  .slide {
    position: absolute; width: 100%; height: 100%;
    border-radius: 20px; padding: 50px 60px;
    display: flex; flex-direction: column; justify-content: center;
    background: linear-gradient(135deg, #ffffff 0%, #f8f9fc 100%);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    opacity: 0; transform: translateX(60px) scale(0.95);
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }
  .slide.active { opacity: 1; transform: translateX(0) scale(1); pointer-events: all; }
  .slide.exit-left { opacity: 0; transform: translateX(-60px) scale(0.95); }
  .slide-number { position: absolute; bottom: 25px; right: 35px; font-size: 13px; color: #adb5bd; letter-spacing: 2px; }
  .slide-cover {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff; text-align: center; align-items: center;
  }
  .slide-cover .greeting { font-size: 22px; font-weight: 300; margin-bottom: 10px; letter-spacing: 6px; opacity: 0.9; }
  .slide-cover .name { font-size: 56px; font-weight: 700; margin-bottom: 20px; letter-spacing: 8px; text-shadow: 0 4px 20px rgba(0,0,0,0.2); }
  .slide-cover .subtitle { font-size: 18px; font-weight: 300; opacity: 0.85; line-height: 1.8; max-width: 550px; margin: 0 auto; }
  .slide-cover .accent-bar { width: 60px; height: 3px; background: rgba(255,255,255,0.6); margin: 25px auto; border-radius: 2px; }
  .section-tag {
    display: inline-block; font-size: 12px; font-weight: 500; text-transform: uppercase;
    letter-spacing: 4px; color: #667eea; margin-bottom: 8px;
  }
  .section-title { font-size: 34px; font-weight: 700; color: #1a1a2e; margin-bottom: 28px; letter-spacing: 2px; }
  .card-row { display: flex; gap: 18px; flex-wrap: wrap; }
  .card {
    flex: 1; min-width: 180px; background: #f8f9fc; border-radius: 14px;
    padding: 22px 20px; border-left: 4px solid #667eea; transition: transform 0.2s;
  }
  .card:hover { transform: translateY(-3px); }
  .card .card-icon { font-size: 26px; margin-bottom: 8px; }
  .card .card-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 6px; }
  .card .card-desc { font-size: 13px; color: #666; line-height: 1.6; }
  .habit-list { list-style: none; }
  .habit-list li {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 14px 0; border-bottom: 1px solid #eee; font-size: 15px; color: #444;
  }
  .habit-list li:last-child { border-bottom: none; }
  .habit-list .icon { font-size: 24px; flex-shrink: 0; margin-top: 2px; }
  .hometown-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .hometown-item {
    background: #fdf6f0; border-radius: 12px; padding: 18px 20px;
    display: flex; gap: 14px; align-items: flex-start;
    border: 1px solid #f0dcc8; transition: transform 0.2s;
  }
  .hometown-item:hover { transform: translateY(-2px); }
  .hometown-item .hw-icon { font-size: 28px; flex-shrink: 0; }
  .hometown-item h4 { font-size: 14.5px; font-weight: 600; color: #6b3a2a; margin-bottom: 3px; }
  .hometown-item p { font-size: 12px; color: #8b6f5e; line-height: 1.5; }
  .hometown-intro {
    font-size: 14px; color: #6b3a2a; margin-bottom: 20px; line-height: 1.7;
    padding: 12px 18px; background: linear-gradient(135deg, #fef9f3, #fdf0e3);
    border-radius: 10px; border-left: 4px solid #e8a850;
  }
  .hobby-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .hobby-item {
    background: linear-gradient(135deg, #f8f9fc 0%, #eef1f8 100%);
    border-radius: 12px; padding: 20px 22px;
    display: flex; gap: 14px; align-items: flex-start;
  }
  .hobby-item .h-icon { font-size: 30px; flex-shrink: 0; }
  .hobby-item h4 { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 4px; }
  .hobby-item p { font-size: 12.5px; color: #777; line-height: 1.6; }
  .code-story { display: flex; flex-direction: column; gap: 16px; }
  .code-story .story-block {
    display: flex; gap: 16px; align-items: flex-start;
    background: linear-gradient(135deg, #f0f4ff 0%, #e8edfb 100%);
    border-radius: 12px; padding: 18px 20px;
    border-left: 4px solid #4a6cf7; transition: transform 0.2s;
  }
  .code-story .story-block:hover { transform: translateX(3px); }
  .code-story .story-icon { font-size: 28px; flex-shrink: 0; }
  .code-story h4 { font-size: 14.5px; font-weight: 600; color: #2d3b6b; margin-bottom: 3px; }
  .code-story p { font-size: 12.5px; color: #5a6a9a; line-height: 1.6; }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
  .skill-tag {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border-radius: 12px; padding: 14px 18px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06); flex: 1; min-width: 150px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .skill-tag:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
  .skill-tag .skill-icon { font-size: 26px; flex-shrink: 0; }
  .skill-tag .skill-info h5 { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 2px; }
  .skill-tag .skill-info span { font-size: 11px; color: #999; }
  .skill-extra { background: #f8f9fc; border-radius: 12px; padding: 16px 22px; font-size: 13px; color: #666; line-height: 1.8; }
  .skill-extra b { color: #4a6cf7; }
  .mindset-block {
    background: #f8f9fc; border-radius: 14px; padding: 22px 28px; margin-bottom: 14px;
    display: flex; gap: 16px; align-items: flex-start;
  }
  .mindset-block .m-icon { font-size: 32px; flex-shrink: 0; }
  .mindset-block h4 { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 4px; }
  .mindset-block p { font-size: 13px; color: #666; line-height: 1.6; }
  .slide-end {
    background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
    color: #fff; text-align: center; align-items: center;
  }
  .slide-end .end-title { font-size: 38px; font-weight: 700; letter-spacing: 4px; margin-bottom: 16px; }
  .slide-end .end-text { font-size: 17px; font-weight: 300; opacity: 0.9; line-height: 1.8; max-width: 500px; margin: 0 auto 30px; }
  .slide-end .thanks { font-size: 24px; letter-spacing: 6px; opacity: 0.8; }
  .controls {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 30px; align-items: center; z-index: 10;
  }
  .btn {
    width: 50px; height: 50px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.08);
    color: #fff; font-size: 20px; cursor: pointer; transition: all 0.3s;
    display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px);
  }
  .btn:hover { background: rgba(255,255,255,0.2); border-color: #fff; }
  .btn:active { transform: scale(0.93); }
  .dots { display: flex; gap: 10px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: rgba(255,255,255,0.35); cursor: pointer; transition: all 0.3s;
  }
  .dot.active { background: #fff; transform: scale(1.3); box-shadow: 0 0 12px rgba(255,255,255,0.6); }
  @media (max-width: 768px) {
    .slide { padding: 30px 28px; border-radius: 14px; }
    .slide-cover .name { font-size: 36px; letter-spacing: 4px; }
    .section-title { font-size: 24px; }
    .hobby-grid, .hometown-grid { grid-template-columns: 1fr; }
    .card-row { flex-direction: column; }
    .skill-tags { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <!-- {{SLIDES}} -->
</div>
<div class="controls">
  <button class="btn" id="prevBtn">◀</button>
  <div class="dots" id="dots"></div>
  <button class="btn" id="nextBtn">▶</button>
</div>
<script>
  (function() {
    const slides = document.querySelectorAll('.slide');
    const dotsContainer = document.getElementById('dots');
    let current = 0; const total = slides.length;
    for (let i = 0; i < total; i++) {
      const dot = document.createElement('span');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.dataset.index = i;
      dot.addEventListener('click', () => goTo(i));
      dotsContainer.appendChild(dot);
    }
    function updateSlide(oldIdx, newIdx) {
      if (oldIdx === newIdx) return;
      slides[oldIdx].classList.remove('active');
      slides[oldIdx].classList.add(newIdx > oldIdx ? 'exit-left' : '');
      setTimeout(() => slides[oldIdx].classList.remove('exit-left'), 500);
      slides[newIdx].classList.add('active');
      dotsContainer.children[oldIdx].classList.remove('active');
      dotsContainer.children[newIdx].classList.add('active');
    }
    function goTo(index) {
      if (index === current || index < 0 || index >= total) return;
      updateSlide(current, index); current = index;
    }
    function next() { goTo((current + 1) % total); }
    function prev() { goTo((current - 1 + total) % total); }
    document.getElementById('prevBtn').addEventListener('click', prev);
    document.getElementById('nextBtn').addEventListener('click', next);
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prev();
    });
  })();
</script>
</body>
</html>
